<!DOCTYPE html>
<!-- Thymeleaf 네임스페이스 추가 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주소록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { height: 100%; margin: 0; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col font-sans text-gray-800">

    <!-- 상단 헤더 영역 -->
    <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
        <h1 class="text-lg font-bold">주소록</h1>
        <div class="relative w-72">
            <input type="text" placeholder="연락처 검색" class="w-full bg-gray-100 border border-gray-200 rounded-full py-1.5 pl-4 pr-10 focus:outline-none focus:bg-white text-sm">
            <i class="fa-solid fa-search absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex flex-1 overflow-hidden">
        
        <!-- 좌측 사이드바 생략 (이전 코드와 동일) ... -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
                <div class="flex p-4 border-b border-gray-100">
                <button class="flex-1 flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-gray-800">
                    <i class="fa-regular fa-star text-lg"></i>
                    <span class="text-xs">즐겨찾기</span>
                </button>
                <button class="flex-1 flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-gray-800 border-l border-gray-100">
                    <i class="fa-solid fa-users text-lg"></i>
                    <span class="text-xs">그룹</span>
                </button>
            </div>

			<div class="flex-1 overflow-y-auto py-2">
				<!-- 조직도 Tree -->
				<div class="px-2">
					<!-- 1. 조직도 버튼 -->
					<div onclick="toggleMenu(this)"
						class="flex items-center gap-2 px-2 py-1.5 hover:bg-gray-100 rounded cursor-pointer text-gray-700">
						<!-- 아이콘에 회전 애니메이션을 위한 클래스(transition-transform duration-200) 추가 -->
						<i
							class="fa-solid fa-caret-down text-gray-400 transition-transform duration-200"></i>
						<span>조직도</span>
					</div>

					<!-- 조직도 하위 영역 -->
					<div class="pl-4">
						<!-- 2. 연습 버튼 -->
						<div onclick="toggleMenu(this)"
							class="flex items-center gap-2 px-2 py-1.5 bg-blue-50 text-blue-600 rounded cursor-pointer font-medium mt-1">
							<!-- 아이콘에 회전 애니메이션 클래스 추가 -->
							<i
								class="fa-solid fa-caret-down transition-transform duration-200"></i>
							<i class="fa-regular fa-building"></i> <span>연습</span>
						</div>

						<!-- 연습 하위 영역 -->
						<div class="pl-6 mt-1">
							<div 
								class="flex items-center gap-2 px-2 py-1.5 hover:bg-gray-100 rounded cursor-pointer text-gray-600">
								<i class="fa-solid fa-user-group text-gray-400"></i> <span>1</span>
							</div>
						</div>
							<div
								class="flex items-center gap-2 px-2 py-1.5 hover:bg-gray-100 rounded cursor-pointer text-gray-600">
								<i class="fa-solid fa-users-line text-gray-400"></i> <span>그룹</span>
							</div>
						
					</div>
				</div>
			</div>

			<!-- Footer text in sidebar -->
            <div class="p-4 text-[10px] text-gray-400 border-t border-gray-100">
                © NAVER Cloud Corp.
            </div>
        </aside>

        <!-- 우측 리스트 영역 -->
        <section class="flex-1 bg-white flex flex-col">
            <!-- 리스트 헤더 -->
            <div class="flex items-center justify-between px-6 py-3 border-b border-gray-200">
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-blue-500 focus:ring-blue-500">
                    <!-- Thymeleaf: 컨트롤러에서 넘긴 totalCount 출력 -->
                    <span class="text-sm font-bold text-gray-800">연습 <span class="text-blue-500" th:text="${totalCount}">3</span></span>
                </div>
            </div>

            <!-- 사원 리스트 목록 -->
            <div class="overflow-y-auto flex-1 p-6 space-y-4">
                
                <!-- 데이터가 없을 경우 (th:if) -->
                <div th:if="${#lists.isEmpty(userList)}" class="text-center text-gray-500 py-10">
                    등록된 사원이 없습니다.
                </div>

                <!-- Thymeleaf 반복문 (th:each) 적용 -->
                <div th:each="user : ${userList}" class="flex items-center gap-4">
                    <!-- 체크박스 value에 사원 이메일이나 ID 매핑 -->
                    <input type="checkbox" th:value="${user.email}" class="w-4 h-4 rounded border-gray-300 text-blue-500 focus:ring-blue-500">
                    
                    <!-- 프로필 동적 렌더링: 색상 클래스 추가(th:classappend), 이름 첫 글자 자르기(substring) -->
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-lg"
                         th:classappend="${user.profileColor != null ? user.profileColor : 'bg-gray-400'}"
                         th:text="${#strings.substring(user.name, 0, 1)}">이</div>
                    
                    <div class="flex flex-col">
                        <!-- 사원 이름 출력 -->
                        <span class="text-sm font-bold text-gray-800" th:text="${user.name}">이름</span>
                        <!-- 부서명과 이메일 합쳐서 출력 -->
                        <span class="text-xs text-gray-500 mt-0.5" th:text="${user.department + ' ' + user.email}">메일</span>
                    </div>
                </div>

            </div>
        </section>
    </main>

</body>
</html>
