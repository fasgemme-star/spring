spring.application.name=spring_thymeleaf

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.thymeleaf.cache=false

#파일 업로드 설정
#사용여부 설정
spring.servlet.multipart.enabled=true
#파일 한개 최대크기
spring.servlet.multipart.max-file-size=10MB
#업로드 파일들의 총 크기(<from> 내부의 모든 값들의 합)
spring.servlet.multipart.max-request-size=100MB
#저장위치(기본위치: OS의 임시경로)
spring.servlet.multipart.location=c:/dev/upload


#DBMS 설정
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@211.63.89.135:1521:orcl
spring.datasource.username=c##customs
spring.datasource.password=factory

#mybatis 설정
mybatis.mapper-locations=classpath:/mappers/*.xml
#mybatis.type-aliases-package=kr.co.sist.emp,kr.co.sist.dept
mybatis.type-aliases-package=kr.co.sist
#쿼리 로그 출력
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl